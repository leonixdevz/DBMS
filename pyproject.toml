[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brickdb"
version = "0.1.0"
description = "A tiny relational DBMS built from scratch: slotted pages, buffer pool, B+ tree indexes, WAL recovery, and a SQL engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Portfolio Author" }]
keywords = ["database", "dbms", "storage-engine", "btree", "sql"]

[project.scripts]
brickdb = "brickdb.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["brickdb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
